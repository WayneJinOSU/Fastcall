apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastcall-api
  namespace: ${PROJECT}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fastcall-api
  template:
    metadata:
      labels:
        app: fastcall-api
    spec:
      containers:
        - name: fastcall-api
          image: ${FASTCALL_IMAGE}
          ports:
            - containerPort: 8766
          env:
            - name: APP_ENV
              value: ${APP_ENV}
            - name: COLLECTION_AGENT_HTTP_URL
              value: http://collection-agent
          envFrom:
            - secretRef:
                name: fastcall-secret
          readinessProbe:
            httpGet:
              path: /state/ready
              port: 8766
          livenessProbe:
            httpGet:
              path: /state/up
              port: 8766
---
apiVersion: v1
kind: Service
metadata:
  name: fastcall-api
  namespace: ${PROJECT}
spec:
  selector:
    app: fastcall-api
  ports:
    - port: 80
      targetPort: 8766
