<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Fastcall 部署与双路径架构</title>
  <desc id="desc">Fast-Call 负责外呼运营，Collection Agent 负责 AI 语音，Adapter 连接统一 FreeSWITCH，同一实例支持真实 SIP 和浏览器 Mock。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title { font: 700 28px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .subtitle { font: 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #64748b; }
      .label { font: 600 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #0f172a; }
      .body { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .small { font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .blue { fill: #eff6ff; stroke: #93c5fd; }
      .green { fill: #f0fdf4; stroke: #86efac; }
      .orange { fill: #fff7ed; stroke: #fdba74; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="50" y="58" class="title">一套系统，两条验证与拨号路径</text>
  <text x="50" y="88" class="subtitle">外呼运营与 AI 对话解耦，共用稳定的 Call、Session 与媒体契约</text>

  <rect x="50" y="135" width="190" height="100" class="box"/>
  <text x="145" y="175" text-anchor="middle" class="label">浏览器 / Open API</text>
  <text x="145" y="204" text-anchor="middle" class="body">Console · 客户系统</text>

  <rect x="290" y="145" width="150" height="80" class="box"/>
  <text x="365" y="180" text-anchor="middle" class="label">Caddy</text>
  <text x="365" y="205" text-anchor="middle" class="body">HTTP / HTTPS</text>

  <rect x="490" y="115" width="245" height="140" class="box blue"/>
  <text x="612" y="155" text-anchor="middle" class="label">Fast-Call</text>
  <text x="612" y="185" text-anchor="middle" class="body">Robot 配置 · 任务与联系人</text>
  <text x="612" y="210" text-anchor="middle" class="body">调度 · 终态 · Webhook</text>
  <text x="612" y="235" text-anchor="middle" class="small">Open API / Scheduler / Worker</text>

  <rect x="800" y="115" width="220" height="140" class="box blue"/>
  <text x="910" y="155" text-anchor="middle" class="label">Adapter</text>
  <text x="910" y="185" text-anchor="middle" class="body">单次拨号授权 · ESL</text>
  <text x="910" y="210" text-anchor="middle" class="body">Agent Session · 媒体桥</text>
  <text x="910" y="235" text-anchor="middle" class="small">FreeSWITCH 故障边界</text>

  <rect x="810" y="345" width="220" height="125" class="box orange"/>
  <text x="920" y="385" text-anchor="middle" class="label">FreeSWITCH</text>
  <text x="920" y="415" text-anchor="middle" class="body">Sofia · loopback · RTP</text>
  <text x="920" y="440" text-anchor="middle" class="small">同一实例 · 按 Call 分流</text>

  <rect x="800" y="535" width="230" height="120" class="box green"/>
  <text x="915" y="575" text-anchor="middle" class="label">Collection Agent</text>
  <text x="915" y="605" text-anchor="middle" class="body">STT → LLM → TTS</text>
  <text x="915" y="630" text-anchor="middle" class="small">打断 · 转写 · 指标 · 分析</text>

  <rect x="1070" y="345" width="110" height="125" class="box"/>
  <text x="1125" y="385" text-anchor="middle" class="label">SIP</text>
  <text x="1125" y="412" text-anchor="middle" class="body">运营商</text>
  <text x="1125" y="440" text-anchor="middle" class="small">真实号码</text>

  <rect x="490" y="535" width="220" height="120" class="box"/>
  <text x="600" y="575" text-anchor="middle" class="label">fastcall</text>
  <text x="600" y="605" text-anchor="middle" class="body">MySQL 8</text>
  <text x="600" y="630" text-anchor="middle" class="small">任务 · Call · Outbox</text>

  <rect x="120" y="535" width="220" height="120" class="box"/>
  <text x="230" y="575" text-anchor="middle" class="label">collection_agents</text>
  <text x="230" y="605" text-anchor="middle" class="body">MySQL 8</text>
  <text x="230" y="630" text-anchor="middle" class="small">指标 · transcript · 分析</text>

  <path d="M240 185 H290" class="line"/>
  <path d="M440 185 H490" class="line"/>
  <path d="M735 185 H800" class="line"/>
  <path d="M910 255 V345" class="line"/>
  <path d="M1030 407 H1070" class="line"/>
  <text x="50" y="345" class="small">Mock 使用同一链路：浏览器 → Fast-Call BFF → Adapter → FreeSWITCH loopback</text>
  <path d="M915 535 H760 V295 H850 V255" class="line"/>
  <text x="650" y="320" class="small">WebSocket / Agent Session</text>
  <path d="M612 255 V535" class="line"/>
  <path d="M800 595 H760 V500 H230 V535" class="line"/>
  <text x="630" y="520" class="small">独立 MySQL</text>

  <rect x="50" y="665" width="1100" height="38" rx="10" fill="#eef2ff"/>
  <text x="600" y="690" text-anchor="middle" class="small">Mock：真实浏览器双向通话已验证　｜　真实运营商 SIP：仍需完成 INVITE / RTP / NAT 线路验收</text>
</svg>
